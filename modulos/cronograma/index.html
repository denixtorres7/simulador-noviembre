<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cronograma de campaña</title><style>:root{--bg:#f3f1eb;--card:#fff;--fg:#1d3034;--line:#a3b0ad;--accent:#165b61;--on:#fff;--soft:#dceee7}
html[data-theme=contrast],html[data-theme=lowvision]{--bg:#000;--card:#101010;--fg:#fff;--line:#fff;--accent:#ffe500;--on:#000;--soft:#343434}
html[data-theme=redgreen]{--bg:#f4f7fa;--card:#fff;--fg:#1a2a3c;--accent:#22518f;--on:#fff;--soft:#e7edf5}
html[data-theme=blueyellow]{--bg:#f7f2f5;--card:#fff;--fg:#302237;--accent:#7c3678;--on:#fff;--soft:#efe4eb}
html[data-theme=soft]{--bg:#f1eee8;--card:#faf8f3;--fg:#303b39;--accent:#4b6261;--on:#fff;--soft:#e5e1d8}
html[data-font=large]{font-size:120%}html[data-font=larger]{font-size:140%}
html[data-dyslexic=on]{font-family:Verdana,Tahoma,sans-serif;letter-spacing:.025em}
*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font:inherit;font-family:system-ui,sans-serif;margin:0;padding:20px;line-height:1.5}main{max-width:1060px;margin:auto}
section{background:var(--card);padding:20px;margin:12px 0;border:1px solid var(--line);border-radius:13px}
button,select,input,textarea{font:inherit;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg);max-width:100%}
button{cursor:pointer}button.primary{background:var(--accent);color:var(--on)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #aa54d7}
.controls{display:flex;gap:9px;flex-wrap:wrap}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}label{display:flex;flex-direction:column;gap:4px}
.total{background:var(--soft);padding:14px;border-radius:9px;font-weight:800;display:flex;justify-content:space-between}
small,.muted{opacity:.85}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);text-align:left;padding:9px}td input{width:100%}
@media print{.no-print{display:none!important}body{background:#fff;color:#111}section{border:0}header{border-bottom:1px solid #555}}
</style></head><body><main><header><h1>Cronograma de campaña</h1><p>Hitos, responsables, fechas y dependencias</p><div class="controls no-print"><label>Paleta<select id="theme"><option value="standard">Estándar</option><option value="contrast">Alto contraste</option><option value="redgreen">Alternativa rojo-verde</option><option value="blueyellow">Alternativa azul-amarillo</option><option value="lowvision">Baja visión</option><option value="soft">Suave</option></select></label><label>Texto<select id="font"><option value="normal">Normal</option><option value="large">Grande</option><option value="larger">Muy grande</option></select></label><button id="read">Leer selección</button><button id="save">Guardar JSON</button><button id="load">Cargar JSON</button><input id="file" type="file" accept=".json" hidden><button id="preview" class="primary">Vista previa / imprimir PDF</button></div></header><section><h2>Registro de actividades</h2><button class="no-print" id="add">Agregar fila</button><div id="rows"></div></section></main><script>const KEY="svc-timeline-v1";let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!data||!Array.isArray(data.rows))data={rows:[]};function render(){$('rows').replaceChildren();data.rows.forEach((r,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML="<label>Actividad<input aria-label=\"Actividad\"></label><label>Responsable<input aria-label=\"Responsable\"></label><label>Fecha de inicio<input aria-label=\"Fecha de inicio\"></label><label>Fecha de entrega<input aria-label=\"Fecha de entrega\"></label><label>Estado<input aria-label=\"Estado\"></label><button type=\"button\">Retirar</button>";const inputs=[...row.querySelectorAll('input')];inputs.forEach((input,j)=>{input.value=r[j]||'';input.addEventListener('input',()=>{r[j]=input.value;store()})});row.querySelector('button').onclick=()=>{data.rows.splice(i,1);store();render()};$('rows').append(row)});} $('add').onclick=()=>{data.rows.push([]);store();render()};render();
const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0);
const store=()=>localStorage.setItem(KEY,JSON.stringify(data));
function saveJson(){store();const blob=new Blob([JSON.stringify({schema:KEY,data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=KEY+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('save').onclick=saveJson;
$('load').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(obj.schema!==KEY||!obj.data||typeof obj.data!=='object')throw Error('Este JSON no corresponde al módulo.');if(!confirm('¿Reemplazar los datos de este módulo?'))return;data=obj.data;store();location.reload()}catch(err){alert(err.message)}};
function settings(s){for(const k of ['theme','font','dyslexic'])if(s?.[k])document.documentElement.dataset[k]=s[k]}
function readSettings(){try{settings({theme:localStorage.getItem('svc-shell-theme')||'standard',font:localStorage.getItem('svc-shell-font')||'normal',dyslexic:localStorage.getItem('svc-shell-dyslexic')||'off'})}catch{}}
window.addEventListener('message',e=>{if(e.data?.type==='svc-global-settings')settings(e.data.settings)});
readSettings();
$('theme').onchange=e=>{document.documentElement.dataset.theme=e.target.value;localStorage.setItem('svc-shell-theme',e.target.value)};
$('font').onchange=e=>{document.documentElement.dataset.font=e.target.value;localStorage.setItem('svc-shell-font',e.target.value)};
$('read').onclick=()=>{if(!('speechSynthesis'in window))return;const t=String(getSelection()).trim();if(!t)return alert('Selecciona el texto que deseas escuchar.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-CO';speechSynthesis.speak(u)};
$('preview').onclick=()=>{store();window.print()};
</script></body></html>
